<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://i.pinimg.com/736x/fe/a4/d5/fea4d57e2883131671570d51bd3a23cd.jpg">
    <link rel="apple-touch-icon" href="https://i.pinimg.com/736x/fe/a4/d5/fea4d57e2883131671570d51bd3a23cd.jpg">
    <title>💜 탐뽀뽀 스마트 가계부 💜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @font-face {
            font-family: 'Munhwa';
            src: url('문화재돌봄체 Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body { font-family: 'Munhwa', sans-serif !important; }
        .tab-btn { transition: all 0.2s; }
        .tab-active { border-bottom: 3px solid #B592FF; color: #B592FF; font-weight: bold; }
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #E6E6FA; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
        
        <!-- 헤더 -->
        <header class="bg-[#B592FF] text-white p-4 text-center text-lg font-bold cursor-pointer hover:bg-[#9B72FF] transition" onclick="switchTab('home')">
         💜 탐뽀뽀 스마트 가계부 💜 
        </header>

        <!-- 3개 탭 메뉴 -->
        <div id="tab-menu" class="flex border-b text-sm hidden">
            <button id="tab-daily" class="flex-1 py-3 text-center tab-active tab-btn" onclick="switchTab('daily')">일간 기록</button>
            <button id="tab-monthly" class="flex-1 py-3 text-center text-gray-500 tab-btn" onclick="switchTab('monthly')">월간 요약</button>
            <button id="tab-annual" class="flex-1 py-3 text-center text-gray-500 tab-btn" onclick="switchTab('annual')">연간 그래프</button>
        </div>

        <!-- 🏠 메인 홈 화면 -->
        <div id="view-home" class="p-6 flex-1 flex flex-col items-center justify-center space-y-4 bg-white">
            
            <div class="w-full max-w-[400px] mb-2">
                <img src="https://i.pinimg.com/originals/9c/2e/4e/9c2e4e7b68290195a5c6cd504e9b5625.png" 
                     alt="메인 이미지" 
                     class="w-full h-auto rounded-2xl shadow-sm object-cover">
            </div>

            <!-- 고정 감성 글귀 -->
            <div class="text-center mb-4 px-2">
                <h2 class="text-lg font-bold text-[#7B68EE] mb-1 leading-snug">오늘을 어떤 조각들로 채웠나요 💜✨</h2>
                <p class="text-xs text-gray-500 mt-1">원하시는 메뉴를 선택해주세요</p>
            </div>
            
            <div class="w-full space-y-3">
                <button onclick="switchTab('daily')" class="w-full bg-[#F8F5FF] border border-[#E6E6FA] text-[#7B68EE] font-bold py-3 px-4 rounded-xl shadow-sm hover:bg-[#E6E6FA] transition flex items-center text-sm">
                    <span class="text-xl mr-3">📝</span> 일간 기록 (지출 작성)
                </button>
                <button onclick="switchTab('monthly')" class="w-full bg-[#F8F5FF] border border-[#E6E6FA] text-[#7B68EE] font-bold py-3 px-4 rounded-xl shadow-sm hover:bg-[#E6E6FA] transition flex items-center text-sm">
                    <span class="text-xl mr-3">📅</span> 월간 지출 요약
                </button>
                <button onclick="switchTab('annual')" class="w-full bg-[#F8F5FF] border border-[#E6E6FA] text-[#7B68EE] font-bold py-3 px-4 rounded-xl shadow-sm hover:bg-[#E6E6FA] transition flex items-center text-sm">
                    <span class="text-xl mr-3">📈</span> 연간 그래프 추이
                </button>
            </div>
            
            <p class="text-xs text-center text-gray-400 mt-6">
                ※ 상단 보라색 제목을 누르면 언제든 이 화면으로 돌아옵니다.
            </p>
        </div>

        <!-- 1. 일간 기록 (Daily) -->
        <div id="view-daily" class="p-5 hidden flex-1 overflow-y-auto">
            <!-- D-Day 알림 배너 -->
            <div id="dday-container" class="mb-4 space-y-2"></div>

            <div class="bg-[#F8F5FF] p-4 rounded-lg mb-6 shadow-sm border border-[#E6E6FA]">
                <form id="expense-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">📅 날짜</label>
                        <input type="date" id="date-input" class="w-full border rounded-lg p-2 bg-white text-sm" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">🗂️ 카테고리</label>
                        <select id="category-select" class="w-full border rounded-lg p-2 bg-white text-sm" onchange="handleCategoryChange()"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">💵 지출 금액</label>
                        <input type="text" inputmode="numeric" id="amount-input" class="w-full border rounded-lg p-2 bg-white" placeholder="예: 50,000" required oninput="formatNumber(this)">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">⏰ 납부 마감일 (선택)</label>
                        <input type="date" id="due-date-input" class="w-full border border-pink-200 rounded-lg p-2 bg-white text-gray-600 text-sm">
                        <p class="text-xs text-[#D87093] mt-1 ml-1">* 마감일을 적으면 상단에 알림 배너가 뜹니다.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">📝 메모 (선택)</label>
                        <input type="text" id="memo-input" class="w-full border rounded-lg p-2 bg-white text-sm" placeholder="예: 냥이즈 간식 등">
                    </div>
                    <button type="button" onclick="saveExpense()" class="w-full bg-[#B592FF] text-white font-bold py-3 rounded-lg hover:bg-[#9B72FF] transition shadow-md">
                        기록 추가하기
                    </button>
                </form>
            </div>
            
            <div class="flex justify-between items-end mb-2 border-b pb-2">
                <h3 class="font-bold text-gray-700">📝 상세 지출 내역</h3>
                <input type="month" id="daily-month-picker" class="border border-[#E6E6FA] text-gray-600 rounded px-2 py-1 text-sm bg-[#F8F5FF]" oninput="renderRecentList()" onchange="renderRecentList()">
            </div>
            <!-- 🔍 검색창 기능 추가 -->
            <input type="text" id="search-input" class="w-full border border-[#E6E6FA] text-gray-600 rounded px-3 py-2 text-sm bg-white mb-4" placeholder="🔍 카테고리, 메모, 금액 검색" oninput="renderRecentList()">
            
            <ul id="recent-list" class="space-y-2 text-sm"></ul>

            <button onclick="exportToCSV()" class="mt-6 w-full bg-[#E6E6FA] text-[#7B68EE] border border-[#C3B1E1] font-bold py-3 rounded-lg hover:bg-[#D8B4FE] hover:text-white transition shadow-sm">
                📥 한셀/엑셀로 데이터 다운로드
            </button>
        </div>

        <!-- 2. 월간 요약 (Monthly) -->
        <div id="view-monthly" class="p-5 hidden flex-1 overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <button onclick="changeMonth(-1)" class="p-2 bg-gray-100 rounded hover:bg-gray-200">◀</button>
                <input type="month" id="month-picker" class="font-bold text-lg border-none text-center bg-transparent" onchange="renderMonthly()">
                <button onclick="changeMonth(1)" class="p-2 bg-gray-100 rounded hover:bg-gray-200">▶</button>
            </div>
            <div class="bg-[#F4F0FF] border border-[#E6E6FA] text-gray-800 p-5 rounded-lg mb-6 shadow-md text-center">
                <p class="text-sm text-gray-500 mb-1">이번 달 총 지출액</p>
                <p id="monthly-total" class="text-3xl font-bold text-[#7B68EE]">0원</p>
            </div>
            <h3 class="font-bold text-gray-700 border-b pb-2 mb-3">카테고리별 요약 <span class="text-xs font-normal text-gray-400 ml-1">(터치하여 상세 보기)</span></h3>
            <ul id="monthly-summary-list" class="space-y-3"></ul>
        </div>

        <!-- 3. 연간 그래프 (Annual) -->
        <div id="view-annual" class="p-5 hidden flex-1 overflow-y-auto">
            <div class="flex items-center justify-center space-x-4 mb-4">
                <button onclick="changeYear(-1)" class="p-2 bg-gray-100 rounded hover:bg-gray-200">◀</button>
                <span id="year-display" class="font-bold text-xl">2026년</span>
                <button onclick="changeYear(1)" class="p-2 bg-gray-100 rounded hover:bg-gray-200">▶</button>
            </div>
            <div class="relative h-72 w-full mb-6">
                <canvas id="annualChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('myExpenses')) || [];
        let categories = JSON.parse(localStorage.getItem('myCategories')) || ['공과금', '관리비', '통신료', '보험료', '학원비', '식비'];
        
        const chartColors = ['#E1CEF0', '#FFE0EB',  '#BDE0FE',  '#DAD9FF',  '#FFFFB4', '#FFD1B5', '#e3f7e8', '#EAEAEA'];
        let annualChartInstance = null;

        window.onload = () => {
            const now = new Date();
            const yearMonth = now.toISOString().slice(0, 7);
            
            document.getElementById('date-input').value = now.toISOString().split('T')[0];
            document.getElementById('month-picker').value = yearMonth;
            document.getElementById('daily-month-picker').value = yearMonth;
            document.getElementById('year-display').dataset.year = now.getFullYear();
            
            initData();
            switchTab('home');
        };

        function initData() {
            renderCategorySelect();
            renderRecentList();
            renderDDayBanner();
        }

        function switchTab(tabId) {
            const tabs = ['home', 'daily', 'monthly', 'annual'];
            const tabMenu = document.getElementById('tab-menu');

            tabs.forEach(id => {
                const viewObj = document.getElementById(`view-${id}`);
                const btnObj = document.getElementById(`tab-${id}`);
                
                if(viewObj) viewObj.classList.add('hidden');
                if(btnObj) {
                    btnObj.classList.remove('tab-active');
                    btnObj.classList.add('text-gray-500');
                }
            });

            const activeView = document.getElementById(`view-${tabId}`);
            if(activeView) activeView.classList.remove('hidden');
            
            if(tabId === 'home') {
                if(tabMenu) tabMenu.classList.add('hidden');
            } else {
                if(tabMenu) tabMenu.classList.remove('hidden');
                const activeBtn = document.getElementById(`tab-${tabId}`);
                if(activeBtn) {
                    activeBtn.classList.add('tab-active');
                    activeBtn.classList.remove('text-gray-500');
                }
            }

            if (tabId === 'monthly') renderMonthly();
            if (tabId === 'annual') renderAnnual();
        }

        function renderCategorySelect() {
            const select = document.getElementById('category-select');
            select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            select.innerHTML += `<option value="ADD_NEW" class="font-bold text-[#B592FF]">+ 새 항목 직접 추가...</option>`;
        }

        function handleCategoryChange() {
            const select = document.getElementById('category-select');
            if (select.value === 'ADD_NEW') {
                const newCat = prompt('추가할 카테고리 이름을 입력하세요:');
                if (newCat && newCat.trim() !== '') {
                    if(!categories.includes(newCat.trim())) {
                        categories.push(newCat.trim());
                        localStorage.setItem('myCategories', JSON.stringify(categories));
                    }
                    renderCategorySelect();
                    select.value = newCat.trim();
                } else {
                    select.value = categories[0];
                }
            }
        }

        function saveExpense() {
            const date = document.getElementById('date-input').value;
            const category = document.getElementById('category-select').value;
            const amountInputVal = document.getElementById('amount-input').value;
            const amount = Number(amountInputVal.replace(/,/g, ''));
            const dueDate = document.getElementById('due-date-input').value;
            const memo = document.getElementById('memo-input').value;
            const isPaid = dueDate ? false : true; 

            if(!date || !amount) return alert('날짜와 금액을 정확히 입력해주세요.');

            expenses.push({ id: Date.now(), date, category, amount, dueDate, memo, isPaid });
            localStorage.setItem('myExpenses', JSON.stringify(expenses));
            
            document.getElementById('amount-input').value = '';
            document.getElementById('memo-input').value = '';
            document.getElementById('due-date-input').value = '';
            document.getElementById('daily-month-picker').value = date.slice(0, 7);
            
            alert('기록되었습니다!');
            initData();
        }

        function deleteExpense(id) {
            if(confirm('이 기록을 삭제하시겠습니까?')) {
                expenses = expenses.filter(e => e.id !== id);
                localStorage.setItem('myExpenses', JSON.stringify(expenses));
                initData();
            }
        }

        // --- 상세 내역 렌더링 (검색 + 미납 최우선 + 최신 날짜순 정렬) ---
        function renderRecentList() {
            const selectedMonth = document.getElementById('daily-month-picker').value;
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const listObj = document.getElementById('recent-list');
            
            // 1. 달력 월에 맞는 데이터 필터링
            let monthRecords = expenses.filter(e => e.date.startsWith(selectedMonth));
            
            // 2. 검색어 필터링
            if(searchKeyword) {
                monthRecords = monthRecords.filter(e => 
                    e.category.toLowerCase().includes(searchKeyword) ||
                    (e.memo && e.memo.toLowerCase().includes(searchKeyword)) ||
                    e.amount.toString().includes(searchKeyword)
                );
            }

            // 3. 정렬 로직 (미납 > 최신 날짜)
            monthRecords.sort((a, b) => {
                const aUnpaid = (a.dueDate && !a.isPaid) ? 1 : 0;
                const bUnpaid = (b.dueDate && !b.isPaid) ? 1 : 0;
                
                // 1순위: 미납 여부 (미납이 1이므로 내림차순 하면 위로 감)
                if (aUnpaid !== bUnpaid) {
                    return bUnpaid - aUnpaid; 
                }
                
                // 2순위: 날짜 (최신 날짜가 위로)
                if (a.date !== b.date) {
                    return new Date(b.date) - new Date(a.date);
                }

                // 3순위: 등록순(ID) 최신이 위로
                return b.id - a.id;
            });
            
            if(monthRecords.length === 0) {
                listObj.innerHTML = '<li class="text-gray-400 text-center py-4">해당하는 기록이 없습니다.</li>';
                return;
            }

            listObj.innerHTML = monthRecords.map(e => {
                let statusBadge = '';
                // 미납 건은 눈에 띄도록 배경색을 다르게 줌
                let bgStyle = 'bg-[#F8F5FF]'; 
                
                if(e.dueDate) {
                    if(e.isPaid) {
                        statusBadge = `<span class="ml-2 px-2 py-0.5 bg-green-100 text-green-600 rounded text-xs font-bold cursor-pointer hover:bg-green-200" onclick="togglePaid(${e.id})">✅ 납부완료</span>`;
                    } else {
                        statusBadge = `<span class="ml-2 px-2 py-0.5 bg-red-100 text-red-500 rounded text-xs font-bold cursor-pointer hover:bg-red-200 animate-pulse" onclick="togglePaid(${e.id})">⏳ 미납 (마감:${e.dueDate.slice(5)})</span>`;
                        bgStyle = 'bg-[#FFF0F5] border-pink-200'; // 미납이면 옅은 핑크색 배경
                    }
                }

                return `
                <li class="flex justify-between items-center ${bgStyle} p-3 rounded border border-[#E6E6FA] mb-2">
                    <div class="flex-1">
                        <div class="flex items-center mb-1">
                            <span class="inline-block bg-[#E6E6FA] text-[#7B68EE] text-xs px-2 py-1 rounded mr-2">${e.category}</span>
                            <span class="text-sm text-gray-500">${e.date.slice(5)}</span>
                            ${statusBadge}
                        </div>
                        ${e.memo ? `<p class="text-xs text-gray-500 mt-1">${e.memo}</p>` : ''}
                    </div>
                    <div class="flex items-center ml-2">
                        <strong class="text-gray-800">${e.amount.toLocaleString()}원</strong>
                        <button onclick="deleteExpense(${e.id})" class="ml-3 text-red-300 text-xs hover:text-red-500 p-1">✕</button>
                    </div>
                </li>
                `;
            }).join('');
        }

        function renderDDayBanner() {
            const container = document.getElementById('dday-container');
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const upcoming = expenses.filter(e => {
                if (!e.dueDate || e.isPaid) return false; 
                const dDate = new Date(e.dueDate);
                dDate.setHours(0, 0, 0, 0);
                const diffTime = dDate - today;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                return diffDays >= 0 && diffDays <= 14; 
            });

            if (upcoming.length === 0) {
                container.innerHTML = '';
                return;
            }

            upcoming.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

            container.innerHTML = upcoming.map(e => {
                const dDate = new Date(e.dueDate);
                dDate.setHours(0, 0, 0, 0);
                const diffTime = dDate - today;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                const dText = diffDays === 0 ? 'D-Day' : `D-${diffDays}`;
                
                return `
                <div class="bg-[#FFF0F5] border border-[#FFB6C1] p-4 rounded-lg shadow-sm flex justify-between items-center mb-2">
                    <div>
                        <span class="font-bold text-[#D87093] text-sm">🚨 [${e.category}] 납부 ${dText}</span>
                        <p class="text-xs text-[#D87093] opacity-80 mt-1">${e.memo ? e.memo : '잊지 말고 납부하세요!'}</p>
                    </div>
                    <div class="flex flex-col items-end">
                        <strong class="text-[#D87093] text-lg mb-1">${e.amount.toLocaleString()}원</strong>
                        <button onclick="togglePaid(${e.id})" class="bg-[#D87093] text-white text-xs px-3 py-1.5 rounded-full hover:bg-pink-600 shadow transition font-bold">납부 완료하기</button>
                    </div>
                </div>`;
            }).join('');
        }

        function togglePaid(id) {
            const exp = expenses.find(e => e.id === id);
            if(exp) {
                exp.isPaid = !exp.isPaid;
                localStorage.setItem('myExpenses', JSON.stringify(expenses));
                renderRecentList();
                renderDDayBanner(); 
            }
        }

        function formatNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function changeMonth(delta) {
            const picker = document.getElementById('month-picker');
            const d = new Date(picker.value + '-01');
            d.setMonth(d.getMonth() + delta);
            picker.value = d.toISOString().slice(0, 7);
            renderMonthly();
        }

        // --- 월간 요약 렌더링 (아코디언 펼쳐보기 기능 적용) ---
        function renderMonthly() {
             targetMonth = document.getElementById('month-picker').value;
             monthlyExps = expenses.filter(e => e.date.startsWith(targetMonth));
            
            let total = 0;
            const summary = {};
            const details = {}; // 항목별 상세 내역을 저장할 객체
            
            categories.forEach(cat => { 
                summary[cat] = 0; 
                details[cat] = []; 
            });
            
            monthlyExps.forEach(e => {
                total += e.amount;
                if(summary[e.category] !== undefined) {
                    summary[e.category] += e.amount;
                    details[e.category].push(e);
                } else {
                    summary[e.category] = e.amount;
                    details[e.category] = [e];
                }
            });

            document.getElementById('monthly-total').innerText = total.toLocaleString() + '원';
            
            const listObj = document.getElementById('monthly-summary-list');
            listObj.innerHTML = Object.entries(summary)
                .filter(([_, amt]) => amt > 0)
                .sort((a, b) => b[1] - a[1]) // 총액 큰 순서대로
                .map(([cat, amt]) => {
                    const percent = total > 0 ? Math.round((amt/total)*100) : 0;
                    
                    // 세부 내역 HTML 생성 (최신 날짜순 정렬)
                    const detailHTML = details[cat].sort((a, b) => new Date(b.date) - new Date(a.date)).map(d => `
                        <div class="flex justify-between items-center text-xs py-2 border-b border-gray-100 last:border-0">
                            <span class="text-gray-500 flex-1 truncate mr-2">${d.date.slice(5)} ${d.memo ? `· ${d.memo}` : ''}</span>
                            <span class="font-medium text-gray-700 whitespace-nowrap">${d.amount.toLocaleString()}원</span>
                        </div>
                    `).join('');

                    // 아이디 값에 공백이 들어갈 수 있으므로 안전하게 변환
                    const safeCatId = 'cat-' + cat.replace(/\s+/g, '-');

                    return `
                    <li class="bg-[#F8F5FF] rounded-lg border border-[#E6E6FA] overflow-hidden mb-3 shadow-sm">
                        <!-- 터치 시 아코디언 토글 -->
                        <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-[#E6E6FA] transition" onclick="toggleAccordion('${safeCatId}')">
                            <div class="flex flex-col">
                                <span class="font-bold text-gray-700 text-base">${cat}</span>
                                <span class="text-xs text-gray-400 mt-0.5">${percent}% 차지</span>
                            </div>
                            <div class="flex items-center">
                                <span class="text-lg font-bold text-[#7B68EE] mr-2">${amt.toLocaleString()}원</span>
                                <span id="icon-${safeCatId}" class="text-gray-400 text-xs transform transition-transform duration-200">▼</span>
                            </div>
                        </div>
                        
                        <!-- 펼쳐지는 숨김 상세 내역 영역 -->
                        <div id="detail-${safeCatId}" class="hidden bg-white px-4 py-2 border-t border-[#E6E6FA]">
                            ${detailHTML}
                        </div>
                    </li>`
                }).join('');
                
            if(listObj.innerHTML === '') listObj.innerHTML = '<li class="text-center text-gray-400 py-4">지출 내역이 없습니다.</li>';
        }

        // 아코디언 열고 닫는 토글 함수
        function toggleAccordion(catId) {
            const detailDiv = document.getElementById(`detail-${catId}`);
            const icon = document.getElementById(`icon-${catId}`);
            
            if (detailDiv.classList.contains('hidden')) {
                detailDiv.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)'; // 화살표 뒤집기
            } else {
                detailDiv.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)'; // 원래대로
            }
        }

        function changeYear(delta) {
            const display = document.getElementById('year-display');
            let year = parseInt(display.dataset.year) + delta;
            display.dataset.year = year;
            display.innerText = year + '년';
            renderAnnual();
        }

        function renderAnnual() {
            const year = document.getElementById('year-display').dataset.year;
            const annualExps = expenses.filter(e => e.date.startsWith(year));

            const datasets = categories.map((cat, index) => ({
                label: cat, data: Array(12).fill(0), backgroundColor: chartColors[index % chartColors.length]
            }));

            annualExps.forEach(e => {
                const monthIndex = parseInt(e.date.split('-')[1]) - 1;
                const ds = datasets.find(d => d.label === e.category);
                if(ds) ds.data[monthIndex] += e.amount;
            });

            const activeDatasets = datasets.filter(ds => ds.data.some(val => val > 0));
            const ctx = document.getElementById('annualChart').getContext('2d');
            if(annualChartInstance) annualChartInstance.destroy();

            annualChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'], datasets: activeDatasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true, suggestedMax: 100000, ticks: { stepSize: 10000, callback: (v) => (v / 10000) + '만' } }
                    },
                    plugins: { tooltip: { mode: 'index', intersect: false, callbacks: { label: (c) => `${c.dataset.label}: ${c.raw.toLocaleString()}원` } } }
                }
            });
        }

        function exportToCSV() {
            if (expenses.length === 0) return alert('내보낼 데이터가 없습니다.');
            let csvContent = '\uFEFF결제 및 등록일,카테고리,금액,마감일,납부여부,메모\n';
            const sortedExps = [...expenses].sort((a, b) => new Date(a.date) - new Date(b.date));
            sortedExps.forEach(e => {
                const memo = e.memo ? e.memo.replace(/,/g, ' ') : ''; 
                const dueDate = e.dueDate ? e.dueDate : '';
                const isPaidText = e.dueDate ? (e.isPaid ? '납부완료' : '미납') : '일반지출';
                csvContent += `${e.date},${e.category},${e.amount},${dueDate},${isPaidText},${memo}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '탐뽀뽀_스마트_가계부.csv';
            link.click();
        }
    </script>
</body>
</html>
